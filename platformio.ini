; WRAITH - ESP32 wireless assessment firmware
; Board: ESP32-WROOM-32 (esp32dev). Optional microSD on VSPI.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = default.csv
board_build.flash_mode = qio

build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DWRAITH_VERSION=\"1.0.0\"

lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  https://github.com/esp32async/ESPAsyncWebServer.git
  https://github.com/esp32async/AsyncTCP.git

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = default.csv
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DWRAITH_VERSION=\"1.0.0\"
  -DWRAITH_S3=1
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  https://github.com/esp32async/ESPAsyncWebServer.git
  https://github.com/esp32async/AsyncTCP.git
